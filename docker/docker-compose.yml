version: '3.8'

services:
  # --- DATABASE: PostgreSQL ---
  logistics-db:
    image: postgres:16-alpine
    container_name: logistics-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "sfl_identity_db,sfl_order_db" # For separating DBs in the future
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d # Auto creating DBs scripts
    networks:
      - logistics-network
    restart: always

  # --- WEB DB MANAGER: pgAdmin ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: logistics-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - logistics-network
    depends_on:
      - logistics-db
    restart: always

  # --- CACHE: Redis ---
  logistics-cache:
    image: redis:7-alpine
    container_name: logistics-redis-cache
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logistics-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- MESSAGE BROKER: RabbitMQ ---
  logistics-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logistics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - logistics-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- INTEGRATION: IntegrationService (RPA Bridge, No DB) ---
  integration-service:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: logistics-integration-service
    depends_on:
      logistics-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: logistics-rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VHost: /
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: SmartFreightLogistics.Identity
      JwtSettings__Audience: SmartFreightLogistics.Gateways
      Rpa__BaseUrl: http://mock-rpa:5004
      OrderService__BaseUrl: http://logistics-order-service:5002
    ports:
      - "5003:8080"
      - "7003:8081"
    networks:
      - logistics-network
    restart: always
    # build:
    #   context: ..
    #   dockerfile: src/Services/IntegrationService/Dockerfile

  # --- TRACKING: TrackingService (Redis Cache-Aside, No DB) ---
  tracking-service:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: logistics-tracking-service
    depends_on:
      logistics-cache:
        condition: service_healthy
      logistics-rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: "logistics-cache:6379,password=${REDIS_PASSWORD}"
      RabbitMq__Host: logistics-rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__VHost: /
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: SmartFreightLogistics.Identity
      JwtSettings__Audience: SmartFreightLogistics.Gateways
    ports:
      - "5004:8080"
      - "7004:8081"
    networks:
      - logistics-network
    restart: always
    # build:
    #   context: ..
    #   dockerfile: src/Services/TrackingService/Dockerfile

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  logistics-network:
    driver: bridge