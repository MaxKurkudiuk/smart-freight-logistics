version: '3.8'

services:
  # --- DATABASE: PostgreSQL ---
  logistics-db:
    image: postgres:16-alpine
    container_name: logistics-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "sfl_identity_db,sfl_order_db" # For separating DBs in the future
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d # Auto creating DBs scripts
    networks:
      - logistics-network
    restart: always

  # --- WEB DB MANAGER: pgAdmin ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: logistics-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - logistics-network
    depends_on:
      - logistics-db
    restart: always

  # --- CACHE: Redis ---
  logistics-cache:
    image: redis:7-alpine
    container_name: logistics-redis-cache
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - logistics-network
    restart: always

  # --- MESSAGE BROKER: RabbitMQ ---
  logistics-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logistics-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - logistics-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  logistics-network:
    driver: bridge